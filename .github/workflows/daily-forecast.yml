# Daily live forecast for all 7 cities, saved as a downloadable artifact.
# GitHub Actions minutes are free on public repositories, so this costs nothing.
# No secrets are needed (all sources are keyless) and nothing is committed back to the repo.
name: Daily forecast

on:
  schedule:
    - cron: "30 1 * * *"  # 01:30 UTC = 08:30 Asia/Bangkok, after Air4Thai has the full previous day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THAIAIR_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Core package only: the served model is LightGBM, so torch is not installed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Forecast all cities
        run: python -m thaiair.live --all --out live_forecast.json

      - uses: actions/upload-artifact@v4
        if: always()  # keep partial results when some cities failed
        with:
          name: live-forecast-${{ github.run_id }}
          path: live_forecast.json
          retention-days: 7
