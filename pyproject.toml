[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thaiair"
version = "0.1.0"
description = "Forecast daily PM2.5 for Thai cities 1-3 days ahead and test it against the CAMS forecast"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# CPU torch: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[deep]"
deep = ["torch>=2.2"]
viz = ["matplotlib>=3.8"]
demo = ["streamlit>=1.40", "pydeck>=0.9", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "models", ".notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # long lines are left to the formatter
    "B008",  # FastAPI Query() defaults are idiomatic
    "B905",  # zip(strict=) not required
]

[tool.setuptools.package-data]
thaiair = ["certs/*.pem"]
